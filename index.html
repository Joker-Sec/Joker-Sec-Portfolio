  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red:  #a23b00;
      --red2: #ff0000d2;
      --white: #ffffff;
    }
    :root {
      --red:  #a23b00;
      --red2: #ff0000d2;
      --white: #ffffff;
    }

    #particles-js {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url("joker.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.75);
      border-left: 2px solid var(--red);
      border-radius: 12px 0 0 12px;
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
      gap: 20px;
      padding: 15px 20px;
      color: var(--white);
      text-decoration: none;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .sidebar a svg {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      fill: var(--white);
    }

    .sidebar a .label {
      font-size: 18px;
      font-weight: bold; 
      letter-spacing: 1px;
      color: var(--white);
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transition: opacity 0.25s, max-width 0.3s;

    }

    .sidebar:hover a .label {
      opacity: 1;
      max-width: 130px;
    }

    .sidebar a:hover {
      background: var(--red);
    }

    .main {
  position: fixed;
  right: 400px !important;
  bottom: 200px;
  left: auto !important;  
  z-index: 100;
  text-align: center;
  animation: fadeUp 1s ease both;
}

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .main .alias {
      font-family: 'Metal Mania', cursive;
      font-size: clamp(5rem, 12vw, 10rem);
      color: var(--white);
      text-shadow: 0 0 30px var(--red2), 2px 2px 0 #000;
      line-height: 1;
      letter-spacing: 4px;
    }

    .main .name {
      font-family: 'Twister Fusion', sans-serif !important; 
      font-size: clamp(2rem, 4vw, 3rem) !important; 
      color: var(--red2);
      letter-spacing: 2px;
      text-transform: none; 
      margin-top: 15px;
      text-shadow: 2px 2px 8px #000; 
      display: block;
      animation: glitchText 3s infinite; 
    }

    @keyframes glitchText {
      0% { opacity: 1; }
      50% { opacity: 0.8; transform: skewX(1deg); }
      100% { opacity: 1; }
    }

    .pulse {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--red2);
      z-index: 200;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.951); }
      50%       { box-shadow: 0 0 0 10px rgba(235, 61, 42, 0); }
    }
  </style>
</head>
